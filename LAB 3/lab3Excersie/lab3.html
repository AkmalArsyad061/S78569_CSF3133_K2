<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbuuk - Lab 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .box {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, button {
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. Header div -->
    <div class="box header-div">
        <h1>Wonderbuuk</h1>
        <span>Your Ultimate Online Bookstore &amp; Community</span>
    </div>

    <!-- 2. Contact form div -->
    <div class="box contact-form-div">
        <h2>Contact Us</h2>
        <form action="#" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">

            <label for="contact-date">Preferred Contact Date:</label>
            <input type="date" id="contact-date" name="contact_date">

            <label for="satisfaction">Satisfaction (1 to 10):</label>
            <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">

            <br><br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- 3. Calculator div -->
    <div class="box calculator-div">
        <h2>Quick Calculator</h2>
        <form oninput="sum.value = (parseInt(num1.value) || 0) + (parseInt(num2.value) || 0)">
            <label for="num1">Nombor 1:</label>
            <input type="number" id="num1" name="num1" value="0">

            <label for="num2">Nombor 2:</label>
            <input type="number" id="num2" name="num2" value="0">

            <p>Jumlah: <output name="sum" for="num1 num2">0</output></p>
        </form>
    </div>

    <!-- 4. Footer div -->
    <div class="box footer-div">
        <p>Hubungi kami: support@wonderbuuk.com | Tel: +60 12-345 6789</p>
        <p>&copy; 2026 Wonderbuuk. All rights reserved.</p>
    </div>

</body>
</html>
